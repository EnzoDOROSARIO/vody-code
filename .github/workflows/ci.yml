# The same gates as `pnpm run check`, plus the test suite, in the order the
# pre-commit hook runs them: each step only runs if the one before it passed.
#
# `pnpm run mutation` is deliberately not here: it is minutes rather than seconds,
# and for now it runs locally — by hand, and in the review workflow's `Mutation`
# phase, which holds a commit until the survivors are dealt with.
#
# `pnpm install` runs the `prepare` script, which applies the `@effect/tsgo`
# patch to the TypeScript and Oxlint binaries in `node_modules`. Lint and
# typecheck depend on that patch, so nothing here may skip the install.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test
